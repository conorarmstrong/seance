[package]
name = "seance_plugin_bitlocker"
version.workspace = true
edition = "2021"
license.workspace = true

[dependencies]
seance_core = { path = "../seance_core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { workspace = true }
tracing = "0.1"
thiserror = "1.0"
aes = "0.8"
xts-mode = "0.5"
ccm = "0.5"
sha2 = "0.10"
zeroize = "1"

[dev-dependencies]
seance_core = { path = "../seance_core", features = ["test-support"] }
seance_plugin_partition = { path = "../seance_plugin_partition" }
uuid = { version = "1.11", features = ["v4"] }
