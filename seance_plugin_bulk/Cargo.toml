[package]
name = "seance_plugin_bulk"
version.workspace = true
edition = "2021"
license.workspace = true

# ForensicsModule wrappers that surface the seance_bulk algorithms in the
# pipeline: AES-key-from-RAM, feature selectors over unallocated space and
# memory, network-packet carving to pcap, and the decode-and-rescan substrate.
# Their outputs are ParsedRecord / FileEntry artifacts, so they appear in the
# analysis, search, timeline and file-grid UIs with no further wiring.

[dependencies]
seance_core = { path = "../seance_core" }
seance_bulk = { path = "../seance_bulk" }
serde_json = { workspace = true }
tracing = "0.1"
uuid = { version = "1.10.0", features = ["v4"] }
hex = "0.4"

[dev-dependencies]
base64 = "0.22"
# `seance_core::test_support::corpus` — the gate that skips when a corpus
# variable is unset and fails when it names a path that is not there.
seance_core = { path = "../seance_core", features = ["test-support"] }
# `SegmentedLayer` — the real memory-image layer, holes and all, so the sweep
# is graded on the read semantics a LiME/ELF image actually has (HUNT-218).
seance_memory = { path = "../seance_memory" }
