[package]
name = "seance_plugin_amcache"
version.workspace = true
edition = "2021"
license.workspace = true

[dependencies]
seance_core = { path = "../seance_core" }
seance_hive_util = { path = "../seance_hive_util" }
seance_hive = { workspace = true }
tracing = "0.1"
serde_json = { workspace = true }
uuid = { version = "1.10.0", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
zerocopy = { version = "0.8", features = ["derive"] }

[dev-dependencies]
# Shared DataSource short-read doubles (seance_core::test_support).
seance_core = { path = "../seance_core", features = ["test-support"] }
