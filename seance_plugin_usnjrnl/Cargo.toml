[package]
name = "seance_plugin_usnjrnl"
version.workspace = true
edition = "2021"
license.workspace = true

[dependencies]
seance_core = { path = "../seance_core" }
tracing = "0.1"
serde_json = { workspace = true }
chrono = "0.4"
uuid = { version = "1.0", features = ["v4", "serde"] }
tracing-subscriber = "0.3"
byteorder = "1.5"

[dev-dependencies]
# Shared DataSource short-read doubles (seance_core::test_support).
seance_core = { path = "../seance_core", features = ["test-support"] }
