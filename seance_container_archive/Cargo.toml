[package]
name = "seance_container_archive"
version.workspace = true
edition = "2021"
license.workspace = true

[dependencies]
chrono = "0.4"
seance_core = { path = "../seance_core" }
anyhow = "1.0"
tracing = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = { workspace = true }
uuid = { version = "1.10.0", features = ["v4", "serde"] }
flate2 = "1.0"
tar = "0.4"
bzip2 = "0.5"
xz2 = "0.1"
# `sevenz-rust2`, not `sevenz-rust`. The latter is unmaintained
# (RUSTSEC-2026-0246) and its last release carries an unfixed path-traversal
# arbitrary-file-write (RUSTSEC-2026-0245, 8.3) with no version to upgrade to.
# Evidence archives are chosen by the person under investigation, so that sits
# squarely inside this tool's threat model. `sevenz-rust2` is the maintained
# fork and carries the traversal guard; this crate applies its own besides, in
# `entry_path::resolve_sevenz_entry_path`, because it never extracts to disk and
# the exposure here is a stored path that lies about where an entry lives.
sevenz-rust2 = "0.21"
cfb = "0.10"
tempfile = "3"

[dev-dependencies]
# Shared DataSource short-read doubles (seance_core::test_support).
seance_core = { path = "../seance_core", features = ["test-support"] }
