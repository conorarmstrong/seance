[package]
name = "seance_search"
version.workspace = true
edition = "2021"
license.workspace = true

[dependencies]
tantivy = "0.27.0"
tantivy-query-grammar = "0.27.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = { workspace = true }
anyhow = "1.0"
tracing = "0.1"
tokio = { version = "1.0", features = ["sync", "macros"] }
uuid = { version = "1.0", features = ["v4", "serde"] }

regex = "1"
aho-corasick = "1.1"
encoding_rs = "0.8"
# Combining-mark classification for the content extractor (VAL-001). MIT OR
# Apache-2.0; already in the lock file as a transitive dependency.
unicode-normalization = "0.1"
globset = "0.4"
sha2 = "0.10"

seance_core = { path = "../seance_core" }

[dev-dependencies]
seance_core = { path = "../seance_core", features = ["test-support"] }
tempfile = "3"
tokio = { version = "1.0", features = ["rt-multi-thread", "macros"] }
