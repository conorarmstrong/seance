[package]
name = "seance_container_zip"
version.workspace = true
edition = "2021"
license.workspace = true

[dependencies]
chrono = "0.4"
seance_core = { path = "../seance_core" }
anyhow = "1.0"
tracing = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = { workspace = true }
uuid = { version = "1.10.0", features = ["v4", "serde"] }
zip = { version = "9", default-features = false, features = ["aes-crypto", "bzip2", "deflate", "time", "zstd"] }