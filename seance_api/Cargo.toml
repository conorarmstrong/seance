[package]
name = "seance_api"
version.workspace = true
edition = "2021"
license.workspace = true

[dependencies]
regex = "1"
memchr = "2"
axum = { version = "0.7.5", features = ["multipart"] }
axum-extra = { version = "0.9", features = ["cookie", "typed-header"] }
tower = { version = "0.4.13", features = ["util"] }
tower-http = { version = "0.5.2", features = ["fs", "cors", "timeout", "limit", "catch-panic", "compression-gzip", "compression-br"] }
tokio = { version = "1.38.0", features = ["full"] } # Use full features for convenience in API server
serde = { version = "1.0.210", features = ["derive"] }
serde_json = { workspace = true }
anyhow = "1.0.89"
tracing = "0.1.40"
tracing-subscriber = "0.3.18"
# Examiner-supplied credentials are zeroed when dropped (HUNT-120).
zeroize = "1"
uuid = { version = "1.10.0", features = ["v4", "serde"] }
tokio-util = { version = "0.7", features = ["io"] }
futures = "0.3"
mime_guess = "2.0"
async-stream = "0.3"
chrono = "0.4"

# Authentication
jsonwebtoken = "9"
bcrypt = "0.15"
time = "0.3"

# OpenAPI Documentation
utoipa = { version = "6", features = ["axum_extras", "uuid", "chrono"] }
utoipa-swagger-ui = { version = "10", features = ["axum"] }

seance_container_zip = { path = "../seance_container_zip" }
seance_container_e01 = { path = "../seance_container_e01", optional = true }
seance_container_aff4 = { path = "../seance_container_aff4" }
seance_container_archive = { path = "../seance_container_archive" }
seance_container_vdisk = { path = "../seance_container_vdisk" }
seance_container_sparseimage = { path = "../seance_container_sparseimage" }
seance_plugin_ext4 = { path = "../seance_plugin_ext4" }
# Memory captures. Without these the API server accepts a memory image, stores
# it, and runs no analysis over it at all — no profile, no stages, and no error,
# because nothing subscribes. The CLI server has always registered them.
#
# All three operating-system tiers are here. The macOS one has never been run
# against a real Mac capture and says so on every record it emits; leaving it out
# did not make that fact safer, it only made a Mac capture silent — see
# `src/modules.rs`.
seance_memory = { path = "../seance_memory" }
seance_plugin_yara = { path = "../seance_plugin_yara" }
seance_plugin_memory_windows = { path = "../seance_plugin_memory_windows" }
seance_plugin_memory_linux = { path = "../seance_plugin_memory_linux" }
seance_plugin_memory_macos = { path = "../seance_plugin_memory_macos" }

seance_core = { path = "../seance_core" }

seance_db = { path = "../seance_db" }

seance_plugin_mft = { path = "../seance_plugin_mft" }
seance_plugin_logfile = { path = "../seance_plugin_logfile" }
seance_plugin_i30 = { path = "../seance_plugin_i30" }
seance_plugin_usnjrnl = { path = "../seance_plugin_usnjrnl" }
seance_plugin_badclus = { path = "../seance_plugin_badclus" }
seance_plugin_sdb = { path = "../seance_plugin_sdb" }
seance_plugin_setupapi = { path = "../seance_plugin_setupapi" }
seance_plugin_stickynotes = { path = "../seance_plugin_stickynotes" }
seance_plugin_pcap = { path = "../seance_plugin_pcap" }
seance_plugin_shellbags = { path = "../seance_plugin_shellbags" }
seance_plugin_lnk = { path = "../seance_plugin_lnk" }
seance_plugin_vss = { path = "../seance_plugin_vss" }
seance_plugin_jumplists = { path = "../seance_plugin_jumplists" }
seance_plugin_srum = { path = "../seance_plugin_srum", optional = true }
seance_plugin_sum = { path = "../seance_plugin_sum", optional = true }
seance_plugin_browser_history = { path = "../seance_plugin_browser_history" }
seance_plugin_registry = { path = "../seance_plugin_registry" }
seance_plugin_evtx = { path = "../seance_plugin_evtx" }
seance_plugin_prefetch = { path = "../seance_plugin_prefetch" }
seance_plugin_partition = { path = "../seance_plugin_partition" }
seance_plugin_carver = { path = "../seance_plugin_carver" }
seance_plugin_amcache = { path = "../seance_plugin_amcache" }
seance_plugin_shimcache = { path = "../seance_plugin_shimcache" }
seance_plugin_recyclebin = { path = "../seance_plugin_recyclebin" }
