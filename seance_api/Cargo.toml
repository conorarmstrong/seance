seance_plugin_desktop_artifacts = { path = "../seance_plugin_desktop_artifacts" }
seance_plugin_thumbcache = { path = "../seance_plugin_thumbcache" }
seance_plugin_fsevents = { path = "../seance_plugin_fsevents" }
seance_plugin_dsstore = { path = "../seance_plugin_dsstore" }
