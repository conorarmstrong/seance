# Content resolution for derived artifacts
lru = "0.18.2"
base64 = "0.22"
zip = { version = "9", default-features = false, features = ["aes-crypto", "bzip2", "deflate", "time", "zstd"] }

# Bulk-export manifest hashing (single-pass alongside ZIP streaming)
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
digest = "0.10"
# Bulk-export archive staged to an auto-deleted temp file
tempfile = "3"
# §3.7: the timeline SQLite export builds a real on-disk database rather than
# holding the whole case in memory.
rusqlite = { version = "0.32", features = ["bundled", "hooks"] }
# §1.3: the read-only SQL editor stages the database artifact the way every
# SQLite parser in the tree does (`TempDb::spill`, with its `-wal` sibling and
# its incompleteness reasons).
seance_sqlite_util = { path = "../seance_sqlite_util" }

# Thumbnail generation (decode common raster formats, encode PNG)
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
# HEIC/HEIF decoding for thumbnails (iPhone photos). Native C (libheif), so
# optional in the same way as e01/esedb.
# Pinned to the v1_19 API rather than the crate's default "latest" (v1_20):
# no Debian release ships libheif >= 1.20 (bookworm 1.15.1, trixie 1.19.8), so
# the default made the container unbuildable from distro packages.
libheif-rs = { version = "2.5.2", optional = true, default-features = false, features = ["v1_19"] }
# Video keyframe thumbnails. `mp4` demuxes (pure Rust); openh264's `source`
# feature builds Cisco's decoder from vendored C into our binary, so there is no
# system library or external process to install.
mp4 = { version = "0.14", optional = true }
openh264 = { version = "0.9", default-features = false, features = ["source"], optional = true }

[features]
# Native-C-backed features, optional so targets whose C libs don't build can
# opt out; on by default. e01 -> libewf (E01/EWF); esedb -> libesedb (ESE/SRUM,
# doesn't build under MSYS2 gcc, so disabled on Windows); heic -> libheif
# (iPhone HEIC photos are HEVC-coded, so they need a real decoder).
default = ["e01", "esedb", "heic", "video-thumbs"]
e01 = ["dep:seance_container_e01"]
# Every ESE reader (SRUM, SUM, WebCache, the Search index and the BITS `qmgr.db` reader) rides the same feature: they share `seance_ese_util` and
# the same libesedb backend, so a build with one and not the others would be a
# distinction without a difference. `webcache` was left unconditional until
# 2026-09-14 and dragged `libesedb-sys` into every e01-only build, which is why
# no x86_64 Windows release asset had ever been built (REL-003).
esedb = ["dep:seance_plugin_srum", "dep:seance_plugin_sum", "dep:seance_plugin_webcache", "dep:seance_plugin_winsearch_edb", "seance_plugin_bits/esedb"]
# heic -> libheif (+libde265): HEIC/HEIF thumbnails.
heic = ["dep:libheif-rs"]
# video-thumbs -> vendored OpenH264 + a pure-Rust MP4 demuxer (no system deps).
video-thumbs = ["dep:mp4", "dep:openh264"]

[dev-dependencies]
tempfile = "3"
# The synthetic encrypted iOS backup builder, for the credential route's
# end-to-end leak test (SEC-204).
seance_plugin_ios_backup = { path = "../seance_plugin_ios_backup", features = ["test-support"] }
flate2 = "1.0"
