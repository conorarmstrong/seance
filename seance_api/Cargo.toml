# The rest of the forensic module set. These are here because `src/modules.rs`
# is the ONE place the pipeline is registered and both binaries call it; this
# server used to keep a second hand-written list that had lost every one of
# them, so an image with an APFS/FAT/XFS/btrfs/HFS+/ISO9660/F2FS volume yielded
# a partition and no files, an encrypted volume was never even tried, and none
# of the messaging or OS-artifact readers ran (LIVE-005).
seance_plugin_apfs = { path = "../seance_plugin_apfs" }
seance_plugin_fat = { path = "../seance_plugin_fat" }
seance_plugin_xfs = { path = "../seance_plugin_xfs" }
seance_plugin_btrfs = { path = "../seance_plugin_btrfs" }
seance_plugin_hfsplus = { path = "../seance_plugin_hfsplus" }
seance_plugin_iso9660 = { path = "../seance_plugin_iso9660" }
seance_plugin_udf = { path = "../seance_plugin_udf" }
seance_plugin_f2fs = { path = "../seance_plugin_f2fs" }
seance_plugin_squashfs = { path = "../seance_plugin_squashfs" }
seance_plugin_perceptual = { path = "../seance_plugin_perceptual" }
seance_plugin_luks = { path = "../seance_plugin_luks" }
seance_plugin_bitlocker = { path = "../seance_plugin_bitlocker" }
seance_plugin_utmp = { path = "../seance_plugin_utmp" }
seance_plugin_secure_sds = { path = "../seance_plugin_secure_sds" }
seance_plugin_asep = { path = "../seance_plugin_asep" }
seance_plugin_installed_apps = { path = "../seance_plugin_installed_apps" }
seance_plugin_android_apps = { path = "../seance_plugin_android_apps" }
seance_plugin_mobile_device = { path = "../seance_plugin_mobile_device" }
seance_plugin_host_identity = { path = "../seance_plugin_host_identity" }
seance_plugin_directory = { path = "../seance_plugin_directory" }
seance_plugin_media = { path = "../seance_plugin_media" }
seance_plugin_ocr = { path = "../seance_plugin_ocr" }
seance_plugin_office = { path = "../seance_plugin_office" }
seance_plugin_signal = { path = "../seance_plugin_signal" }
seance_plugin_viber = { path = "../seance_plugin_viber" }
seance_plugin_kik = { path = "../seance_plugin_kik" }
seance_plugin_skype = { path = "../seance_plugin_skype" }
seance_plugin_chrome_cache = { path = "../seance_plugin_chrome_cache" }
seance_plugin_leveldb = { path = "../seance_plugin_leveldb" }
seance_plugin_webcache = { path = "../seance_plugin_webcache", optional = true }
seance_plugin_wechat = { path = "../seance_plugin_wechat" }
seance_plugin_line = { path = "../seance_plugin_line" }
seance_plugin_fbmessenger = { path = "../seance_plugin_fbmessenger" }
seance_plugin_telegram = { path = "../seance_plugin_telegram" }
seance_plugin_instagram = { path = "../seance_plugin_instagram" }
seance_plugin_snapchat = { path = "../seance_plugin_snapchat" }
seance_plugin_twitter = { path = "../seance_plugin_twitter" }
seance_plugin_pe = { path = "../seance_plugin_pe" }
seance_plugin_ios_artifacts = { path = "../seance_plugin_ios_artifacts" }
seance_plugin_clipboard = { path = "../seance_plugin_clipboard" }
seance_plugin_bits = { path = "../seance_plugin_bits", default-features = false }
