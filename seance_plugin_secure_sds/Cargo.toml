[package]
name = "seance_plugin_secure_sds"
version.workspace = true
edition = "2021"
license.workspace = true

[dependencies]
seance_core = { path = "../seance_core" }
serde_json = { workspace = true }
thiserror = "1.0.64"
tracing = "0.1.40"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
seance_core = { path = "../seance_core", features = ["test-support"] }
# The join key is graded on a real volume: the MFT parser publishes each
# record's `security_id` and the `$Secure:$SDS` stream, and this module decodes
# the stream.
seance_plugin_mft = { path = "../seance_plugin_mft" }
flate2 = "1.0"
