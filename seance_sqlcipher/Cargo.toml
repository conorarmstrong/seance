[package]
name = "seance_sqlcipher"
version.workspace = true
edition = "2021"
license.workspace = true

[dependencies]
aes = "0.8"
cbc = "0.1"
cipher = "0.4"
hmac = "0.12"
sha1 = "0.10"
pbkdf2 = { version = "0.11", default-features = false }
md-5 = "0.10"
# SQLCipher 4: HMAC-SHA512 page MACs and the PBKDF2-HMAC-SHA512 HMAC-key derivation.
sha2 = "0.10"
# Key material is wiped from memory when a `RawKeySpec` is dropped.
zeroize = "1"

[dev-dependencies]
# The real-store test reads the key spec out of the keychain export at run time
# and opens the decrypted store with SQLite; neither is needed by the library.
plist = "1.6"
rusqlite = { version = "0.32", features = ["bundled"] }
tempfile = "3"
seance_core = { path = "../seance_core", features = ["test-support"] }
