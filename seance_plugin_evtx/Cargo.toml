[package]
name = "seance_plugin_evtx"
version.workspace = true
edition = "2021"
license.workspace = true

[dependencies]
anyhow = "1.0"
chrono = "0.4"
tracing = "0.1"
serde_json = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
uuid = { version = "1.0", features = ["v4"] }
quick-xml = "0.31"
memchr = "2"
seance_xml_util = { path = "../seance_xml_util" }

seance_core = { path = "../seance_core" }
evtx = "0.8.5" # A Rust crate for parsing Windows Event Log files

[dev-dependencies]
seance_core = { path = "../seance_core", features = ["test-support"] }