[package]
name = "seance_plugin_partition"
version.workspace = true
edition = "2021"
license.workspace = true

[dependencies]
seance_core = { path = "../seance_core" }
seance_container_raid = { path = "../seance_container_raid" }
gpt = "4.1.0"
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = { workspace = true }
tracing = "0.1"
uuid = { version = "1.0", features = ["v4", "serde"] }
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
seance_core = { path = "../seance_core", features = ["test-support"] }
# Enable the RAID crate's synthetic-superblock builder for our detection tests,
# so we share one builder rather than re-deriving the on-disk layout.
seance_container_raid = { path = "../seance_container_raid", features = ["test-support"] }
