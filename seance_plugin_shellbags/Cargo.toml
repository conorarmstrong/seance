[package]
name = "seance_plugin_shellbags"
version.workspace = true
edition = "2021"
license.workspace = true

[dependencies]
seance_shell_item = { path = "../seance_shell_item" }
seance_hive_util = { path = "../seance_hive_util" }
seance_core = { path = "../seance_core" }
anyhow = "1.0"
tracing = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = { workspace = true }
uuid = { version = "1.0", features = ["v4", "serde"] }
seance_hive = { workspace = true }
byteorder = "1.5"
chrono = { version = "0.4", features = ["serde"] }