[package]
name = "seance_plugin_srum"
version.workspace = true
edition = "2021"
license.workspace = true

[dependencies]
seance_core = { path = "../seance_core" }
anyhow = "1.0"
tracing = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = { workspace = true }
uuid = { version = "1.10.0", features = ["v4", "serde"] }
byteorder = "1.5"
libesedb = "0.2"
seance_ese_util = { path = "../seance_ese_util" }
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"

[dev-dependencies]
# Shared DataSource short-read doubles (seance_core::test_support).
seance_core = { path = "../seance_core", features = ["test-support"] }
