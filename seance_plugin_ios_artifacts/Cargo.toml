[package]
name = "seance_plugin_ios_artifacts"
version.workspace = true
edition = "2021"
license.workspace = true

# Schema-aware parsers for iOS device databases that were previously only
# raw-dumped as generic SqliteRows: Voicemail, Calendar, Notes, Photos,
# Safari, HealthKit.
[dependencies]
seance_core = { path = "../seance_core" }
seance_sqlite_util = { path = "../seance_sqlite_util" }
anyhow = "1.0"
tracing = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = { workspace = true }
uuid = { version = "1.10.0", features = ["v4", "serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Safari keeps a tab's last-visit time and back/forward list in embedded
# binary plists; the recent-searches store is one.
plist = "1.6"
# A Notes body is gzip-wrapped protobuf.
flate2 = "1.0"

[dev-dependencies]
# Shared DataSource short-read doubles (seance_core::test_support).
seance_core = { path = "../seance_core", features = ["test-support"] }
