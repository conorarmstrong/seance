[package]
name = "seance_plugin_perceptual"
version.workspace = true
edition = "2021"
license.workspace = true

# Computes an open PDQ perceptual hash for every decodable image, so
# near-duplicate derivatives (re-encoded, resized, cropped) can be found and
# images can be matched against externally-supplied PDQ hash sets. Emits a
# PerceptualHash record per image; matching against a known set is a query-time
# concern over these hashes.

[dependencies]
seance_core = { path = "../seance_core" }
seance_vics = { path = "../seance_vics" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
serde_json = { workspace = true }
tracing = "0.1"
uuid = { version = "1.10.0", features = ["v4"] }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
