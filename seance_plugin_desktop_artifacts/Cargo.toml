[package]
name = "seance_plugin_desktop_artifacts"
version.workspace = true
edition = "2021"
license.workspace = true

# macOS/Linux desktop forensic parsers: shell history, freedesktop Trash
# (.trashinfo), and GTK recently-used.xbel. Pure text/XML/INI parsing, no
# external file-format crates.
[dependencies]
seance_core = { path = "../seance_core" }
anyhow = "1.0"
tracing = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = { workspace = true }
uuid = { version = "1.10.0", features = ["v4", "serde"] }

[dev-dependencies]
seance_core = { path = "../seance_core", features = ["test-support"] }
