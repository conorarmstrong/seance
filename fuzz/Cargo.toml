[package]
name = "seance-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
# Explicit, not `workspace = true`: this crate is excluded from the workspace
# (see the root manifest), so it is its own root and has no
# `[workspace.dependencies]` to inherit from — the inherited form made every
# `cargo fuzz` invocation fail at manifest parse (GATE-007).
serde_json = "1.0"
uuid = { version = "1.10", features = ["v4"] }

[dependencies.seance_core]
path = "../seance_core"

[dependencies.seance_plugin_mft]
path = "../seance_plugin_mft"

[dependencies.seance_plugin_usnjrnl]
path = "../seance_plugin_usnjrnl"

[dependencies.seance_plugin_logfile]
path = "../seance_plugin_logfile"

[dependencies.seance_plugin_ext4]
path = "../seance_plugin_ext4"

[dependencies.seance_plugin_registry]
path = "../seance_plugin_registry"

[dependencies.seance_hive]
path = "../seance_hive"

[dependencies.seance_memory]
path = "../seance_memory"

[dependencies.seance_plugin_evtx]
path = "../seance_plugin_evtx"

[dependencies.seance_plugin_prefetch]
path = "../seance_plugin_prefetch"

[dependencies.seance_plugin_macos_artifacts]
path = "../seance_plugin_macos_artifacts"

[dependencies.seance_plugin_lnk]
path = "../seance_plugin_lnk"

[dependencies.seance_plugin_partition]
path = "../seance_plugin_partition"

[dependencies.seance_plugin_btrfs]
