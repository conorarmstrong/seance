[package]
name = "seance_plugin_vss"
version.workspace = true
edition = "2021"
license.workspace = true

[dependencies]
seance_core = { path = "../seance_core" }
seance_plugin_mft = { path = "../seance_plugin_mft" }
anyhow = "1.0"
tracing = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = { workspace = true }
uuid = { version = "1.10.0", features = ["v4", "serde"] }
byteorder = "1.5"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
[dev-dependencies]
md-5 = "0.10"
