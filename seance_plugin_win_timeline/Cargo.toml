[package]
name = "seance_plugin_win_timeline"
version.workspace = true
edition = "2021"
license.workspace = true

# Schema-aware parser for the Windows 10/11 Timeline database
# (ActivitiesCache.db): user app/document/web/clipboard activity.
[dependencies]
seance_core = { path = "../seance_core" }
seance_sqlite_util = { path = "../seance_sqlite_util" }
anyhow = "1.0"
tracing = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = { workspace = true }
uuid = { version = "1.10.0", features = ["v4", "serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
# Shared DataSource short-read doubles (seance_core::test_support).
seance_core = { path = "../seance_core", features = ["test-support"] }
rusqlite = { version = "0.32", features = ["bundled"] }
