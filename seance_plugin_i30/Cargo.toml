[package]
name = "seance_plugin_i30"
version.workspace = true
edition = "2021"
license.workspace = true

[dependencies]
seance_core = { path = "../seance_core" }
serde_json = { workspace = true }
tracing = "0.1"
byteorder = "1.5"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
uuid = { version = "1.0", features = ["serde", "v4"] }
tracing-subscriber = "0.3"

[dev-dependencies]
# The slack pass is graded on a real volume (`ntfs_index.raw.gz`), walked the
# way the pipeline walks it: the MFT parser emits the `$I30` stream and this
# module reads it.
seance_plugin_mft = { path = "../seance_plugin_mft" }
flate2 = "1.0"
