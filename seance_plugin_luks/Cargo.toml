[package]
name = "seance_plugin_luks"
version.workspace = true
edition = "2021"
license.workspace = true

[dependencies]
seance_core = { path = "../seance_core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { workspace = true }
uuid = { version = "1.11", features = ["v4", "serde"] }
tracing = "0.1"
thiserror = "1.0"
base64 = "0.22"
zeroize = "1"

# Cryptography (RustCrypto)
aes = "0.8"
xts-mode = "0.5"
pbkdf2 = "0.12"
argon2 = "0.5"
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
cbc = "0.1"

[dev-dependencies]
seance_core = { path = "../seance_core", features = ["test-support"] }
rand = "0.8"
base64 = "0.22"
argon2 = "0.5"
serde_json = { workspace = true }
