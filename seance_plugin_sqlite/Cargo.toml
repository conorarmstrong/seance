[package]
name = "seance_plugin_sqlite"
version.workspace = true
edition = "2021"
license.workspace = true

[dependencies]
seance_core = { path = "../seance_core" }
anyhow = "1.0"
tracing = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = { workspace = true }
uuid = { version = "1.10.0", features = ["v4", "serde"] }
base64 = "0.22"

[dev-dependencies]
seance_core = { path = "../seance_core", features = ["test-support"] }
# rusqlite is used ONLY to build test fixtures and cross-check live tables.
# The runtime evidence path never touches it (no driver, no temp copy).
rusqlite = { version = "0.32", features = ["bundled"] }
